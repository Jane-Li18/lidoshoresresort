<script>
        document.addEventListener('DOMContentLoaded', function () {
    async function fetchRebookingAvailability(date) {
        try {
            const response = await fetch(`/api/getRoomAvailability?date=${date.toISOString().split('T')[0]}`);
            if (!response.ok) {
                console.error(`Error fetching availability for ${date.toISOString().split('T')[0]}`);
                return { totalAvailable: 0 };
            }
            const data = await response.json();
            return data; // Assumes API returns { totalAvailable: <number> }
        } catch (error) {
            console.error(`Error fetching availability for ${date.toISOString().split('T')[0]}:`, error);
            return { totalAvailable: 0 };
        }
    }

            // Render calendar with availability
            async function renderCalendar(calendarId, monthYearId, bodyId, month, year) {
                const monthYear = document.getElementById(monthYearId);
                const calendarBody = document.getElementById(bodyId);
            
                const firstDay = new Date(year, month, 1).getDay();
                const lastDate = new Date(year, month + 1, 0).getDate();
                const now = new Date();
            
                monthYear.textContent = `${new Intl.DateTimeFormat('en-US', { month: 'long' }).format(new Date(year, month))} ${year}`;
                calendarBody.innerHTML = ''; // Clear previous calendar content
            
                let date = 1;
                const dates = []; // Store all the dates for batch fetching
                const cells = []; // Store cells for later updates
            
                for (let i = 0; i < 6; i++) {
                    const row = document.createElement('tr');
                    for (let j = 0; j < 7; j++) {
                        const cell = document.createElement('td');
                        if (i === 0 && j < firstDay || date > lastDate) {
                            cell.classList.add('not-current-month');
                        } else {
                            const cellDate = new Date(year, month, date);
                            const dateContent = document.createElement('div');
                            dateContent.textContent = date;
                            dateContent.className = 'date-number';
            
                            const availability = document.createElement('div');
                            availability.className = 'availability';
            
                            // Add loading spinner
                            const loadingSpinner = document.createElement('div');
                            loadingSpinner.className = 'loading-spinner';
                            loadingSpinner.style.width = '16px';
                            loadingSpinner.style.height = '16px';
                            loadingSpinner.style.border = '3px solid var(--bgtertiary)';
                            loadingSpinner.style.borderTop = '3px solid var(--bgsecondary)';
                            loadingSpinner.style.borderRadius = '50%';
                            loadingSpinner.style.animation = 'spin 1s linear infinite';
                            loadingSpinner.style.margin = 'auto';
            
                            cell.appendChild(dateContent);
                            cell.appendChild(loadingSpinner);
                            cell.classList.add('disabled'); // Disable the date initially
            
                            dates.push(cellDate); // Add the date for fetching
                            cells.push({ cell, cellDate, loadingSpinner, availability }); // Save cell data for later updates
            
                            date++;
                        }
                        row.appendChild(cell);
                    }
                    calendarBody.appendChild(row);
                }
            
                // Throttled Fetching
                const batchSize = 5; // Adjust based on your server's capacity
                for (let i = 0; i < dates.length; i += batchSize) {
                    const batch = dates.slice(i, i + batchSize);
            
                    const batchResults = await Promise.all(
                        batch.map(async (date) => ({
                            date,
                            data: await fetchRebookingAvailability(date),
                        }))
                    );
            
                    // Update cells with the fetched data
                    batchResults.forEach(({ date, data }) => {
                        const { cell, loadingSpinner, availability } = cells.find((c) => c.cellDate.getTime() === date.getTime());
            
                        loadingSpinner.remove(); // Remove the spinner
                        const roomsAvailable = data.totalAvailable || 0;
            
                        if (roomsAvailable > 0) {
                            availability.textContent = `${roomsAvailable} Avail..`;
                            availability.style.color = 'green';
                            cell.classList.remove('disabled'); // Make clickable
                            cell.classList.add('clickable');
                            cell.addEventListener('click', () => handleDateClick(date));
                        } else {
                            availability.textContent = 'Full';
                            availability.style.color = 'red';
                            cell.classList.add('disabled');
                        }
                        cell.appendChild(availability);
                    });
                }
            }

                    // Add CSS for the spinner
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            .loading-spinner {
                width: 16px;
                height: 16px;
                border: 2px solid #f3f3f3;
                border-top: 2px solid #3498db;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
        `;
        document.head.appendChild(style);

            // Update navigation button states
    function updateButtonState(currentYear, currentMonth) {
        const now = new Date();
        const maxMonth = now.getMonth() + 1; // Limit to 2 months ahead
        const maxYear = now.getFullYear() + Math.floor(maxMonth / 12);
    
        const nextButton = document.getElementById('next');
        const prevButton = document.getElementById('previous');
    
        // Disable "Next" if beyond the limit
        nextButton.disabled = currentYear > maxYear || (currentYear === maxYear && currentMonth > maxMonth % 12);
    
        // Disable "Previous" if before the current month
        prevButton.disabled = currentYear === now.getFullYear() && currentMonth <= now.getMonth();
    }


    async function initializeCalendar(calendarId, monthYearId, bodyId, month, year) {
        await renderCalendar(calendarId, monthYearId, bodyId, month, year);
    
        // Reapply "Check-in" and "Check-out" marks
        document.querySelectorAll('.calendar td').forEach((cell) => {
            const cellDate = new Date(cell.getAttribute('data-date'));
    
            if (isSameDate(cellDate, checkInDate)) {
                cell.classList.add('check-in');
                addLabel(cell, 'Check-in');
            }
            if (isSameDate(cellDate, checkOutDate)) {
                cell.classList.add('check-out');
                addLabel(cell, 'Check-out');
            }
            if (checkInDate && checkOutDate && cellDate > checkInDate && cellDate < checkOutDate) {
                cell.classList.add('in-range');
            }
        });
    }


    function handleButtonState(currentYear, currentMonth) {
        const now = new Date();
        const maxMonth = now.getMonth() + 1; // Limit to current and next 2 months
        const maxYear = now.getFullYear() + Math.floor(maxMonth / 12);
    
        const nextButton = document.getElementById('next');
        const prevButton = document.getElementById('previous');
    
        nextButton.disabled = currentYear > maxYear || (currentYear === maxYear && currentMonth > maxMonth % 12);
        prevButton.disabled = currentYear === now.getFullYear() && currentMonth <= now.getMonth();
    }
    

    // Initialize two months for the modal calendar
    const now = new Date();
    let currentMonth = now.getMonth();
    let currentYear = now.getFullYear();
    
    initializeCalendar('calendar3', 'monthYear3', 'calendarBody3', currentMonth, currentYear);
    initializeCalendar('calendar4', 'monthYear4', 'calendarBody4', currentMonth + 1, currentYear);
    handleButtonState(currentYear, currentMonth);


        // Navigation Buttons
        document.getElementById('next').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            initializeCalendar('calendar3', 'monthYear3', 'calendarBody3', currentMonth, currentYear);
            initializeCalendar('calendar4', 'monthYear4', 'calendarBody4', currentMonth + 1, currentYear);
            handleButtonState(currentYear, currentMonth);
        });
        
        document.getElementById('previous').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            initializeCalendar('calendar3', 'monthYear3', 'calendarBody3', currentMonth, currentYear);
            initializeCalendar('calendar4', 'monthYear4', 'calendarBody4', currentMonth + 1, currentYear);
            handleButtonState(currentYear, currentMonth);
        });
        
    
        // Initialize Button States
        handleButtonState(currentYear, currentMonth);
        
            // Initialize both calendars
            const today = new Date();
            const thisMonth = today.getMonth();
            const thisYear = today.getFullYear();
        
            renderCalendar('calendar3', 'monthYear3', 'calendarBody3', thisMonth, thisYear);
            renderCalendar('calendar4', 'monthYear4', 'calendarBody4', thisMonth + 1, thisYear);
        
            document.querySelectorAll('.btn-rebook').forEach(button => {
                button.addEventListener('click', () => {
                    const reservationID = button.getAttribute('data-reservation');
                    
                    // Show the modal
                    showModal(reservationID);
                    
                    // Trigger the "Next" button
                    const nextButton = document.getElementById('next');
                    if (nextButton) {
                        nextButton.click();
                    }
                });
            });
            
            
            document.getElementById('close-modal').addEventListener('click', hideModal);
            document.getElementById('cancel-modal').addEventListener('click', hideModal);
            
            window.addEventListener('click', event => {
                const rebookModal = document.getElementById('rebooking-modal');
                if (event.target === rebookModal) {
                    hideModal();
                }
            });
            
            
        });
</script>
