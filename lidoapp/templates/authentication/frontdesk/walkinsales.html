<div class="dashboard-container" style="padding: 50px; display: flex; flex-direction: row; justify-content: space-between;">
    <!-- Line Chart for Daily Walk-in Sales (Left Side) -->
    <div class="chart-container" style="width: 45%; background-color: var(--bgtertiary); padding: 20px; border: 0.25px solid rgba(0, 0, 0, 0.3);">
        <h3>Walk-in Sales</h3>
        <canvas id="walkInSalesLineChart"></canvas>
    </div>

    <!-- Details Area for Walk-in Sales (Right Side) -->
    <div class="details-container" id="walkInSalesDetails" style="width: 45%; background-color: var(--bgtertiary); padding: 20px; border: 0.25px solid rgba(0, 0, 0, 0.3);">
        <h3>Walk-in Sales Details</h3>
        <div id="walkInSalesDetailsContent">
            <p>Select a date to see the details</p>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>
    // Fetch walk-in sales data and details from Django context
    const walkInSalesData = {{ walk_in_sales_data|safe }};
    const walkInReservationDetailsData = {{ walk_in_reservation_details_data|safe }};
    
    // Ensure variables are initialized before they are used
    const walkInLabels = walkInSalesData.map(sale => new Date(sale.arrival_datetime).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }));
    const walkInSalesTotals = walkInSalesData.map(sale => sale.total_sales);

    // Debugging: Check if the variables are populated
    console.log("Labels:", walkInLabels);
    console.log("Sales Totals:", walkInSalesTotals);

    // Walk-in Pagination variables
    let currentWalkInReservations = [];
    let currentWalkInPage = 0;
    const walkInPageSize = 5;

    // Function to get walk-in reservation details based on the hovered date
    function getWalkInReservationDetails(date) {
        const selectedWalkInDate = new Date(date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        currentWalkInReservations = walkInReservationDetailsData.filter(reservation => {
            const arrivalDate = new Date(reservation.arrival_datetime).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            return arrivalDate === selectedWalkInDate;
        });
        displayWalkInReservations();
    }

    // Function to display walk-in reservation details in a table format
    function displayWalkInReservations() {
        const walkInSalesDetailsContent = document.getElementById('walkInSalesDetailsContent');
        const start = currentWalkInPage * walkInPageSize;
        const end = Math.min(start + walkInPageSize, currentWalkInReservations.length);
        const walkInReservationsToDisplay = currentWalkInReservations.slice(start, end);

        let html = `
            <table>
                <tr>
                    <th>Guest</th>
                    <th>Arrival</th>
                    <th>Status</th>
                    <th>Total</th>
                </tr>
        `;

        walkInReservationsToDisplay.forEach(res => {
            html += `
                <tr>
                    <td>${res.first_name} ${res.last_name}</td>
                    <td>${new Date(res.arrival_datetime).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</td>
                    <td>${res.status_rate}</td>
                    <td>PHP ${res.overall_total_amount}</td>
                </tr>
            `;
        });
        html += '</table>';

        // Add pagination buttons for Walk-in sales
        html += `
            <div class="pagination-buttons">
                <button onclick="previousWalkInPage()" ${currentWalkInPage === 0 ? 'disabled' : ''}>Previous</button>
                <button onclick="nextWalkInPage()" ${end >= currentWalkInReservations.length ? 'disabled' : ''}>Next</button>
            </div>
        `;

        walkInSalesDetailsContent.innerHTML = html;
    }

    function previousWalkInPage() {
        if (currentWalkInPage > 0) {
            currentWalkInPage--;
            displayWalkInReservations();
        }
    }

    function nextWalkInPage() {
        if ((currentWalkInPage + 1) * walkInPageSize < currentWalkInReservations.length) {
            currentWalkInPage++;
            displayWalkInReservations();
        }
    }

    // Line Chart for Daily Walk-in Sales
    var ctxWalkInLine = document.getElementById('walkInSalesLineChart').getContext('2d');
    var walkInSalesLineChart = new Chart(ctxWalkInLine, {
        type: 'line',
        data: {
            labels: walkInLabels,
            datasets: [{
                label: 'Daily Walk-in Sales (PHP)',
                data: walkInSalesTotals,
                fill: false,
                borderColor: '#ff6384',
                tension: 0.1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            onHover: (event, chartElement) => {
                if (chartElement.length > 0) {
                    var index = chartElement[0].index;
                    var label = walkInSalesLineChart.data.labels[index];
                    getWalkInReservationDetails(label);
                }
            }
        }
    });
</script>
