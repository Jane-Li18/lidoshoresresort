<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<style>
    /* Flexbox Parent Container */
    .revenue-row-container {
        display: flex;
        flex-direction: row; /* Align containers horizontally */
        justify-content: space-between; /* Create space between the two sections */
        align-items: flex-start; /* Align items at the top of the row */
        gap: 20px; /* Space between the containers */
        max-width: 1200px; /* Limit the total width of the row */
        margin: 20px auto; /* Center the row horizontally */
    }

    /* Shared Styles for All Containers */
    .revenue-weekly-container,
    .revenue-monthly-container {
        background-color: var(--bgtertiary);
        border: 1px solid #ccc;
        padding: 20px;
        text-align: center;
    }

    /* Weekly Revenue Chart Specific Styles */
    .revenue-weekly-container {
        flex: 2; /* Weekly container takes more space */
        max-width: 70%; /* Wider width for Weekly Revenue chart */
    }

    /* Monthly Revenue Chart Specific Styles */
    .revenue-monthly-container {
        flex: 1; /* Monthly container takes less space */
        max-width: 30%; /* Narrower width for Monthly Revenue chart */
    }

    /* Pie Chart Specific Styles */
    .chart-container {
        width: 300px;
        height: 350px;
        background-color: var(--bgtertiary);
        padding: 30px;
        margin: 0 auto; /* Center the chart-container horizontally */
        display: flex;
        flex-direction: column;
        align-items: center; /* Center the content horizontally */
        justify-content: center; /* Center the content vertically */
    }

    .chart-container canvas {
        max-width: 100%;
        max-height: 100%;
    }

    /* Recent Accounts List */
    .recent-accounts-list {
        width: 100%;
        max-height: 200px; /* Limit height for the list */
        overflow-y: auto; /* Add scroll if the list exceeds the height */
        background-color: #f9f9f9; /* Light background for contrast */
        border: 1px solid #ccc;
        padding: 10px;
        box-sizing: border-box;
        border-radius: 5px;
    }

    .recent-accounts-list ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
    }

    .recent-accounts-list ul li {
        margin: 5px 0;
        font-size: 14px;
    }
</style>

<div class="revenue-row-container">
    <!-- Weekly Revenue Section -->
    <div class="revenue-weekly-container">
        <div class="weekly-chart-container">
            <h2>Weekly Revenue</h2>
            <p>Track the revenue generated during each week, displayed with start and end dates <br>(Monday to Sunday) for detailed analysis.</p>
            <hr>
            <canvas id="weeklyRevenueChart"></canvas>
        </div>

        <button class="btn-one" style="margin-top: 85px;" onclick="location.href='{% url 'download_weekly_sales_report' %}'">
            Download Weekly Sales Report <span></span>
        </button>
                

    </div>

    <!-- Monthly Revenue Section -->
    <div class="revenue-monthly-container">
        <div class="monthly-chart-container">
            <h2>Monthly Revenue</h2>
            <p>Total revenue generated for each month</p>
            <hr>
            <canvas id="monthlyRevenueChart"></canvas>
        </div>
        <hr>
        
        <!-- Pie Chart for Guest and Admin Accounts -->
        <div class="chart-container">
            <h2>Lido Accounts</h2>
            <canvas id="accountPieChart"></canvas>
            <ul style="margin-top: 20px; list-style: none; padding: 0;">
                {% for guest in recent_guests %}
                    <li>{{ guest.first_name }}</li>
                {% endfor %}
            </ul>
        </div>
        
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Fetch the data
        fetch('/revenue-data/')
            .then(response => response.json())
            .then(data => {
                // Weekly Revenue Chart
                const weeklyRevenueChart = new Chart(document.getElementById('weeklyRevenueChart'), {
                    type: 'bar',
                    data: {
                        labels: data.weekly_labels,
                        datasets: [{
                            label: 'Weekly Revenue (PHP)',
                            data: data.weekly_values,
                            backgroundColor: 'rgba(131, 177, 123, 0.5)',
                            borderColor: 'rgba(131, 177, 123, 1)',
                            borderWidth: 1,
                        }],
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    afterLabel: function (tooltipItem) {
                                        const salesCount = data.weekly_sales_counts[tooltipItem.dataIndex];
                                        return `Number of Sales: ${salesCount}`;
                                    },
                                },
                            },
                            datalabels: {
                                anchor: 'center',
                                align: 'center',
                                formatter: (value) => `₱${value.toLocaleString()}`,
                                color: '#000',
                            },
                        },
                        scales: {
                            x: {
                                ticks: {
                                    callback: function (value, index) {
                                        const [monday, sunday] = data.weekly_labels[index].split(' - ');
                                        return `${monday}\n${sunday}`;
                                    },
                                },
                            },
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: (value) => 'PHP ' + value.toLocaleString(),
                                },
                            },
                        },
                    },
                    plugins: [ChartDataLabels],
                });

                // Monthly Revenue Chart
                const monthlyRevenueChart = new Chart(document.getElementById('monthlyRevenueChart'), {
                    type: 'bar',
                    data: {
                        labels: data.monthly_labels,
                        datasets: [{
                            label: 'Monthly Revenue (PHP)',
                            data: data.monthly_values,
                            backgroundColor: 'rgba(131, 177, 123, 0.2)',
                            borderColor: 'rgba(131, 177, 123, 0.5)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        layout: {
                            padding: { top: 20, bottom: 20, left: 20, right: 20 }
                        },
                        plugins: {
                            legend: { display: false },
                            datalabels: {
                                anchor: 'center',
                                align: 'center',
                                formatter: (value) => `₱${value.toLocaleString()}`,
                                color: '#000',
                                font: { weight: 'bolder' }
                            }
                        },
                        scales: {
                            x: { ticks: { maxRotation: 0, minRotation: 0 } },
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: value => 'PHP ' + value.toLocaleString(),
                                    padding: 10
                                }
                            }
                        }
                    },
                    plugins: [ChartDataLabels],
                });

                // Download Weekly Sales PDF
                document.querySelector('.btn-one').addEventListener('click', function () {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF();

                    pdf.setFontSize(18);
                    pdf.text("Weekly Sales Report", 10, 10);

                    const canvas = document.getElementById('weeklyRevenueChart');
                    if (!canvas) {
                        console.error('Canvas not found!');
                        return;
                    }

                    // Convert canvas to image
                    const canvasImage = canvas.toDataURL('image/png', 1.0);

                    // Adjust for A4 paper size
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    const canvasWidth = pageWidth - 20; // 10mm padding
                    const aspectRatio = canvas.height / canvas.width;
                    const canvasHeight = canvasWidth * aspectRatio;

                    // Add image to PDF
                    pdf.addImage(canvasImage, 'PNG', 10, 20, canvasWidth, canvasHeight);

                    // Optional: Add a note below the chart
                    pdf.setFontSize(12);
                    pdf.text("This report shows weekly revenue trends based on data.", 10, canvasHeight + 30);

                    // Save the PDF
                    pdf.save('Weekly_Sales_Report.pdf');
                });

            })
            .catch(error => console.error('Error fetching revenue data:', error));
    });
</script>
