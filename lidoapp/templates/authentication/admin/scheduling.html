<style>
.scheduling-container {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    width: 300px;
    justify-content: center;
  }

  .scheduling-container h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  .schedule-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    margin-bottom: 5px;
    font-size: 14px;
  }

  .form-group input,
  .form-group select {
    padding: 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  .add-person-btn {
    margin-top: 10px;
    padding: 10px;
    font-size: 16px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .add-person-btn:hover {
    background-color: #0056b3;
  }
</style>


<div class="scheduling-container">
    <h2>Scheduling</h2>
    <form id="scheduleForm" class="schedule-form">
      <div id="personFields">
        <div class="form-group">
          <label for="name1">Name</label>
          <input type="text" id="name1" name="name1" placeholder="Enter name" required>
        </div>
        <div class="form-group">
          <label for="time1">Time</label>
          <input type="time" id="time1" name="time1" required>
        </div>
        <div class="form-group">
          <label for="day1">Day</label>
          <select id="day1" name="day1" required>
            <option value="">Select day</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>
      </div>
      <button type="button" id="addPersonBtn" class="add-person-btn">Add Person</button>
      <button type="button" id="saveScheduleBtn" class="add-person-btn" style="background-color: green;">Save Schedule</button>
    </form>
    <div id="calendar" style="margin-top: 20px;"></div>
</div>

  <script>
    const addPersonBtn = document.getElementById('addPersonBtn');
    const personFields = document.getElementById('personFields');
    let personCount = 1;
    const saveScheduleBtn = document.getElementById('saveScheduleBtn');
const calendarDiv = document.getElementById('calendar');

saveScheduleBtn.addEventListener('click', () => {
    const scheduleForm = document.getElementById('scheduleForm');
    const inputs = scheduleForm.querySelectorAll('input, select');
    const scheduleData = [];

    // Gather form data
    for (let i = 0; i < inputs.length; i += 3) {
        const name = inputs[i].value;
        const time = inputs[i + 1].value;
        const day = inputs[i + 2].value;

        if (name && time && day) {
            scheduleData.push({ name, time, day });
        }
    }

    // Display schedule in a calendar-like format
    calendarDiv.innerHTML = `
      <table style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr>
            <th style="border: 1px solid #ccc; padding: 8px;">Day</th>
            <th style="border: 1px solid #ccc; padding: 8px;">Name</th>
            <th style="border: 1px solid #ccc; padding: 8px;">Time</th>
          </tr>
        </thead>
        <tbody>
          ${scheduleData
            .map(
              (entry) =>
                `<tr>
                  <td style="border: 1px solid #ccc; padding: 8px;">${entry.day}</td>
                  <td style="border: 1px solid #ccc; padding: 8px;">${entry.name}</td>
                  <td style="border: 1px solid #ccc; padding: 8px;">${entry.time}</td>
                </tr>`
            )
            .join('')}
        </tbody>
      </table>
    `;
});


    addPersonBtn.addEventListener('click', () => {
      if (personCount < 5) {
        personCount++;
        const newPersonHTML = `
          <div class="form-group">
            <label for="name${personCount}">Name</label>
            <input type="text" id="name${personCount}" name="name${personCount}" placeholder="Enter name" required>
          </div>
          <div class="form-group">
            <label for="time${personCount}">Time</label>
            <input type="time" id="time${personCount}" name="time${personCount}" required>
          </div>
          <div class="form-group">
            <label for="day${personCount}">Day</label>
            <select id="day${personCount}" name="day${personCount}" required>
              <option value="">Select day</option>
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </div>
        `;
        personFields.insertAdjacentHTML('beforeend', newPersonHTML);
      } else {
        alert('You can only add up to 5 persons.');
      }
    });
  </script>
