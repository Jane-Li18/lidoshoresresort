<div class="dashboard-container">
    <!-- Bar Chart for Add-On Stock and Sales -->
    <div class="linechart-container">
        <h2>Add-On Stock and Sales</h2>
        <p>Monitor the current stock levels and sales trends for each add-on.</p>
        <hr>
        <canvas id="stockSalesChart"></canvas>
    </div>
</div>

<script>
    // Chart Data from Backend
    const chartData = {{ chart_data|safe }};
    const labels = chartData.labels;  // Add-on names
    const sales = chartData.sales;    // Sales data
    const stocks = chartData.stocks;  // Stock levels

    // Render Bar Chart for Add-Ons
    const ctx = document.getElementById('stockSalesChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Sales',
                    data: sales,
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1,
                },
                {
                    label: 'Stock Remaining',
                    data: stocks,
                    backgroundColor: 'rgba(75, 192, 192, 0.5)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1,
                },
            ],
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                },
            },
        },
    });
</script>
