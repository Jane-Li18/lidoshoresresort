{% extends 'base.html' %}
{% block title %}Add New Add-On{% endblock title %}

{% block content %}
{% block mainnav %}{% endblock mainnav %}
{% block profile %}{% endblock profile %}

{% include 'authentication/admin/lidoadminnavbar.html' %}

<style>
    .form-container {
        background-color: var(--bgtertiary);
        max-width: 600px;
        margin: 30px auto;
        padding: 20px;
    }

    .form-container h2 {
        text-align: center;
        margin-bottom: 20px;
        text-transform: uppercase;
        font-size: 18px;
    }

    .form-container form {
        display: flex;
        flex-direction: column;
    }

    .form-container label {
        margin: 10px 0 5px;
    }

    .form-container input[type="text"],
    .form-container input[type="number"],
    .form-container input[type="file"],
    .form-container textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        font-size: 1rem;
    }

    .form-container textarea {
        resize: vertical;
        height: 100px;
    }

    @media (max-width: 768px) {
        .form-container {
            padding: 15px;
        }

        .form-container button {
            font-size: 0.9rem;
            padding: 8px 15px;
        }
    }
</style>

<div class="form-container">
    <h2>Add New Add-On</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required>

        <label for="description">Description</label>
        <textarea name="description" id="description"></textarea>

        <label for="price">Price (₱)</label>
        <input type="number" name="price" id="price" step="0.01" required>

        <label for="stock_quantity">Stock Quantity</label>
        <input type="number" name="stock_quantity" id="stock_quantity" required>

        <label for="image">Image</label>
        <input type="file" name="image" id="image">

        <button type="submit" class="btn-one">Save <span></span></button>
    </form>
</div>
{% endblock content %}
